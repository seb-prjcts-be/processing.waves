<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal Loom - full p5.waves loom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f7f2e8; }
    #canvas-shell { position: fixed; inset: 0; }
    #canvas-shell canvas { display: block; }
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.7rem 1.4rem;
      font-family: 'Oswald', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.78rem;
      color: #090908;
      pointer-events: none;
      z-index: 5;
    }
    .topbar .mark { font-weight: 700; border-bottom: 2px solid #090908; }
    .topbar .runtime { color: #555; }
  </style>
</head>
<body>
  <div id="canvas-shell"></div>
  <div class="topbar">
    <div class="mark">Signal Loom</div>
    <div class="runtime">p5.waves / processing.waves</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.2.2/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/seb-prjcts-be/p5.waves@main/p5.waves.min.js"></script>
  <script src="./signal-loom-sketch.js"></script>
</body>
</html>
